name: Publish
# Push a v<version> tag (npm run release prints the commands) to publish the game packages to GitHub Packages.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@joeyanglx'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish -w shared -w client
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
