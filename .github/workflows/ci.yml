name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@joeyanglx'
      # The platform packages live in AllHandsOnBoard: PACKAGES_TOKEN (read:packages) reads them, unless
      # each package has granted this repo access (package settings → Manage Actions access).
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
      - run: npm run typecheck
      - run: npm run build
